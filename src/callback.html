<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aprimo DAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .logo {
      color: #0057A8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }
    .countdown {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 20px;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 13px;
      color: #475569;
    }
    .error-details {
      margin-top: 16px;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 12px;
      color: #991b1b;
      text-align: left;
      word-break: break-word;
    }
    .try-again {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #0057A8;
      color: white;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .try-again:hover { background: #004a92; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">Aprimo DAM</div>

  <? if (success) { ?>

  <div class="icon">✅</div>
  <h1>Connected!</h1>
  <p>Your Aprimo account is now linked. You can close this window and return to your document.</p>
  <div class="countdown" id="countdown">Closing in 3s…</div>

  <script>
    let n = 3;
    const el = document.getElementById('countdown');
    const t = setInterval(() => {
      n--;
      el.textContent = n > 0 ? `Closing in ${n}s…` : 'Closed.';
      if (n <= 0) { clearInterval(t); window.close(); }
    }, 1000);
  </script>

  <? } else { ?>

  <div class="icon">❌</div>
  <h1>Connection Failed</h1>
  <p>Something went wrong during the authorization flow.</p>

  <? if (errorMessage) { ?>
  <div class="error-details"><?= errorMessage ?></div>
  <? } ?>

  <br>
  <button class="try-again" onclick="window.close()">Close & Try Again</button>

  <? } ?>
</div>

</body>
</html>
